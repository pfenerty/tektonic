name: publish

# Releases are cut by pushing a vX.Y.Z tag. This workflow publishes to npmjs through
# trusted publishing (OIDC): no token is stored anywhere, and npm generates a provenance
# attestation automatically for a public package built from a public repo.
#
# It lives here rather than in the Tekton self-CI pipeline because npm only accepts
# GitHub Actions, GitLab CI/CD and CircleCI as OIDC issuers — a self-hosted cluster
# cannot be a trusted publisher. Everything else (test, build, scan) still runs in Tekton
# on push and pull_request; see .tektonic/.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets the job mint the OIDC token npm exchanges for a short-lived publish credential.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm >= 11.5.1; the runner's bundled npm can be older.
      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@latest

      - run: npm ci

      # The tag must name the version being published, or a mistagged release would
      # quietly publish whatever happens to be in package.json. The packages version
      # together, so every workspace has to match; the root is private and versionless.
      - name: Check the tag matches every package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          bad=0
          for ws in $(node -p "require('./package.json').workspaces.join(' ')"); do
            version=$(node -p "require('./${ws}/package.json').version")
            if [ "$tag" != "$version" ]; then
              echo "tag ${GITHUB_REF_NAME} does not match ${ws} version ${version}"
              bad=1
            fi
          done
          exit $bad

      - run: npm test

      - run: npm run build

      # Re-running a release workflow is routine, and republishing an existing version is
      # an npm error — treat "already there" as success, per package. Workspaces publish in
      # the root's order, core first, so the providers' peer range on it is satisfiable the
      # moment they appear on the registry.
      - name: Publish
        run: |
          for ws in $(node -p "require('./package.json').workspaces.join(' ')"); do
            name=$(node -p "require('./${ws}/package.json').name")
            version=$(node -p "require('./${ws}/package.json').version")
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "${name}@${version} is already on the registry, skipping"
              continue
            fi
            npm publish -w "${name}" --access public
          done
